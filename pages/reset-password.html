<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Midwife Connect Rwanda</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>
body{margin:0;background:#f7faf9;font-family:Arial,sans-serif}.box{max-width:480px;margin:10vh auto;background:#fff;padding:36px;border-radius:20px;box-shadow:0 12px 40px #00000012}.box h1{margin-top:0}.box input{width:100%;box-sizing:border-box;padding:13px;margin:8px 0 16px;border:1px solid #d8e2df;border-radius:10px}.box button{width:100%;padding:13px;border:0;border-radius:10px;background:#8b4f82;color:#fff;font-weight:700}.msg{margin:15px 0;padding:12px;border-radius:9px;display:none}.error{display:block;background:#fff0f0;color:#a22}.ok{display:block;background:#eefaf3;color:#176b3b}
</style>
</head>
<body>
<div class="box">
<h1>Set a new password</h1>
<p>Choose a strong password for your Midwife Connect Rwanda account.</p>
<div id="msg" class="msg"></div>
<form id="resetForm">
<label for="password">New password</label>
<input id="password" type="password" minlength="8" required>
<label for="confirm">Confirm password</label>
<input id="confirm" type="password" minlength="8" required>
<button type="submit">Update Password</button>
</form>
<p><a href="login.html">Back to login</a></p>
</div>
<script>
const form=document.getElementById("resetForm"), msg=document.getElementById("msg");
function show(text,ok=false){msg.textContent=text;msg.className="msg "+(ok?"ok":"error");}
mcrSupabase.auth.onAuthStateChange((event, session)=>{
  if(event==="PASSWORD_RECOVERY" && session) window.__canReset=true;
});
form.addEventListener("submit",async e=>{
 e.preventDefault();
 const p=document.getElementById("password").value,c=document.getElementById("confirm").value;
 if(p.length<8)return show("Password must contain at least 8 characters.");
 if(p!==c)return show("Passwords do not match.");
 const {error}=await mcrSupabase.auth.updateUser({password:p});
 if(error)return show(error.message);
 show("Password updated successfully. You can now log in.",true);
 setTimeout(()=>location.replace("login.html"),1200);
});
</script>
</body>
</html>
