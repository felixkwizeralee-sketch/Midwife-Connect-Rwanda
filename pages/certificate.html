<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Certificate | Midwife Connect Rwanda</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth-guard.js"></script>
<style>
.cert{max-width:900px;margin:45px auto;padding:20px}.certificate{background:#fff;border:8px double #8b4f82;border-radius:12px;padding:55px;text-align:center;box-shadow:0 15px 40px #0001}.certificate h1{font-size:48px;margin:10px}.certificate .name{font-size:34px;font-weight:800;color:#8b4f82;margin:25px}.muted{color:#647572}.btn{border:0;background:#8b4f82;color:#fff;padding:12px 18px;border-radius:9px;font-weight:700;cursor:pointer;margin-top:20px}@media print{header,.actions{display:none!important}.cert{margin:0}.certificate{box-shadow:none}}
</style>
</head>
<body>
<header class="header"><div class="logo"><h1>Midwife Connect Rwanda</h1><p>Certificate Center</p></div><a href="dashboard.html" class="login-btn">Dashboard</a></header>
<main class="cert">
<div class="certificate">
<p class="muted">MIDWIFE CONNECT RWANDA</p>
<h1>Certificate of Completion</h1>
<p>This certificate is presented to</p>
<div class="name" data-user-name>Student</div>
<p>for successfully completing the required learning activities in the Midwife Connect Rwanda learning platform.</p>
<p class="muted">Issued: <span id="date"></span></p>
<p class="muted">Certificate ID: <span id="id"></span></p>
</div>
<div class="actions" style="text-align:center"><button class="btn" onclick="window.print()">Print / Save as PDF</button></div>
</main>
<script>
document.getElementById("date").textContent=new Date().toLocaleDateString();
const u=window.MCR_CURRENT_USER?.id||"user";document.getElementById("id").textContent=("MCR-"+u.replaceAll("-","").slice(0,12)).toUpperCase();
</script>
</body></html>
