<!DOCTYPE html>
<html lang="en">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account</title>

<link rel="stylesheet" href="../css/style.css">

</head>



<body>


<section class="login-page">


<div class="login-card">


<div class="login-logo">

<h1>🩺</h1>

<h2>Join Midwife Connect Rwanda</h2>

<p>Your health learning partner</p>

</div>



<input 
id="name"
placeholder="Full Name">



<input 
id="email"
placeholder="Email">



<input 
id="password"
type="password"
placeholder="Password">



<select id="role">

<option>
Choose Account Type
</option>

<option value="student">
🎓 Student Midwife
</option>

<option value="midwife">
👩‍⚕️ Registered Midwife
</option>

<option value="pregnant">
🤰 Pregnant Woman
</option>

<option value="youth">
🧑 Youth
</option>

<option value="pharmacist">
💊 Pharmacist
</option>

</select>




<button 
class="main-btn"
onclick="registerUser()">

Create Account

</button>



<p>

Already registered?

<a href="login.html">
Login
</a>

</p>



</div>


</section>



<script src="../js/auth.js"></script>


</body>

</html>
